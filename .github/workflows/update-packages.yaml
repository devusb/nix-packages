name: update-packages
on:
  workflow_dispatch:
  schedule:
    - cron: '0 08 * * *'
jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31.10.7
        with:
          nix_path: nixpkgs=flake:nixpkgs
      - name: Update flake packages
        uses: gepbird/nix-update-action@v3.1.2
        with:
          blacklist: "am2rlauncher,igb,pgdiff,quakejs,xmltv,message-bridge,heb-mcp"
          branch: "update_packages_action"
          pr-title: "Update packages"
